<!doctype html>
<html lang="ko-KR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>@Keyframes 애니메이션</title>
    <link rel="shortcut icon" href="/favicon/likelion.ico" type="image/x-icon" />
    <link rel="icon" href="/favicon/likelion.svg" type="image/svg+xml" />
    <link rel="preload" as="font" href="/font/suit/SUIT-Variable.woff2" />
    <link rel="stylesheet" href="/font/suit/SUIT-Variable.css" />
    <link rel="stylesheet" href="/src/common/index.css" />
    <link rel="stylesheet" href="/src/css/styles/20-keyframes-animation.css" />
  </head>
  <body style="margin: 50px">
    <div class="go-index"><a href="/index.html">Index로 이동</a></div>
    <h1>@Keyframes 애니메이션</h1>
    <hr />
    <div class="container">
      <div class="keyframes-wrapper">
        <strong>Fade 애니메이션</strong>
        <div class="controls">
          <button type="button" class="reset-animation">초기화</button>
          <button type="button" class="toggle-animation">재생</button>
        </div>
        <p class="target-animation fade">멋쟁이</p>
      </div>
      <div class="keyframes-wrapper">
        <strong>Shrink 애니메이션</strong>
        <div class="controls">
          <button type="button" class="reset-animation">초기화</button>
          <button type="button" class="toggle-animation">재생</button>
        </div>
        <p class="target-animation shrink">멋쟁이</p>
      </div>
      <div class="keyframes-wrapper">
        <strong>Bounce 애니메이션</strong>
        <div class="controls">
          <button type="button" class="reset-animation">초기화</button>
          <button type="button" class="toggle-animation">재생</button>
        </div>
        <p class="target-animation bounce">멋쟁이</p>
      </div>
      <div class="keyframes-wrapper">
        <strong>Spin 애니메이션</strong>
        <div class="controls">
          <button type="button" class="reset-animation">초기화</button>
          <button type="button" class="toggle-animation">재생</button>
        </div>
        <p class="target-animation spin">멋쟁이</p>
      </div>
      <div class="keyframes-wrapper">
        <strong>CSS 변수 활용 애니메이션</strong>
        <div class="controls">
          <button type="button" class="reset-animation">초기화</button>
          <button type="button" class="toggle-animation">재생</button>
        </div>
        <p class="target-animation angle">멋쟁이</p>
      </div>
    </div>

    <script>
      const container = document.querySelector('.container');

      // 1. 애니메이션 토글 함수
      function toggleAnimation(element, button) {
        const style = window.getComputedStyle(element);
        const isRunning = style.animationPlayState === 'running';

        element.style.animationPlayState = isRunning ? 'paused' : 'running';
        button.textContent = isRunning ? '재생' : '멈춤';
        button.style.background = isRunning ? 'var(--dark-blue)' : 'firebrick';
      }

      // 2. 애니메이션 리셋 함수
      function resetAnimation(element, toggleBtn) {
        element.style.animation = 'none';
        void element.offsetWidth; // Reflow 강제 발생
        element.style.animation = '';
        element.style.animationPlayState = 'paused';

        if (toggleBtn) {
          toggleBtn.textContent = '재생';
          toggleBtn.style.background = 'var(--dark-blue)';
        }
      }

      // 3. 이벤트 위임
      container.addEventListener('click', (event) => {
        const button = event.target;
        if (!button.matches('button')) return;

        // [핵심] 클릭된 버튼이 속한 가장 가까운 wrapper를 찾습니다.
        const wrapper = button.closest('.keyframes-wrapper');
        // wrapper 안에서 애니메이션 대상(.target-animation)을 찾습니다.
        const targetElement = wrapper.querySelector('.target-animation');
        const toggleBtn = wrapper.querySelector('.toggle-animation');

        if (!targetElement) return;

        if (button.classList.contains('toggle-animation')) {
          toggleAnimation(targetElement, button);
        } else if (button.classList.contains('reset-animation')) {
          resetAnimation(targetElement, toggleBtn);
        }
      });
    </script>
  </body>
</html>
