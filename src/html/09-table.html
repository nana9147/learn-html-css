<!doctype html>
<html lang="ko-KR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>테이블 관련 요소</title>
    <link rel="shortcut icon" href="/favicon/likelion.ico" type="image/x-icon" />
    <link rel="icon" href="/favicon/likelion.svg" type="image/svg+xml" />
    <link rel="preload" as="font" href="/font/suit/SUIT-Variable.woff2" />
    <link rel="stylesheet" href="/font/suit/SUIT-Variable.css" />
    <link rel="stylesheet" href="/src/common/index.css" />
    <style>
      table {
        width: 100%;
        border: 1px solid currentColor;
      }
      th,
      td {
        text-align: center;
        border: 1px solid currentColor;
      }
      thead,
      tfoot {
        background-color: #3e9;
      }
      [rowspan] {
        background-color: #8da;
      }
      .team {
        width: 70px;
      }
      .name,
      .gender {
        width: 100px;
      }
    </style>
  </head>
  <body style="margin: 50px">
    <div class="go-index"><a href="/index.html">Index로 이동</a></div>
    <h1>테이블 관련 요소</h1>
    <hr />
    <table>
      <caption>
        멋사 프론트엔드 부트캠프 17기
      </caption>
      <col class="team" />

      <colgroup>
        <col class="name" />
        <col class="gender" />
      </colgroup>
      <thead>
        <tr>
          <th scope="col">회고조</th>
          <th scope="col">이름</th>
          <th scope="col">성별</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <th scope="rowgroup" rowspan="3">0조</th>
          <td>강서진</td>
          <td>여성</td>
        </tr>
        <tr>
          <td>슬비쌤</td>
          <td>여성</td>
        </tr>
        <tr>
          <td>민규선</td>
          <td>여성</td>
        </tr>
      </tbody>
      <tbody>
        <tr>
          <th scope="rowgroup" rowspan="6">1조</th>
          <td>강재훈</td>
          <td>남성</td>
        </tr>
        <tr>
          <td>김연수</td>
          <td>여성</td>
        </tr>
        <tr>
          <td>김준서</td>
          <td>남성</td>
        </tr>
        <tr>
          <td>오은진</td>
          <td>여성</td>
        </tr>
        <tr>
          <td>이우현</td>
          <td>남성</td>
        </tr>
        <tr>
          <td>최유종</td>
          <td>남성</td>
        </tr>
      </tbody>
      <tbody>
        <tr>
          <th scope="rowgroup" rowspan="5">2조</th>
          <td>김도혁</td>
          <td>남성</td>
        </tr>
        <tr>
          <td>박규나</td>
          <td>여성</td>
        </tr>
        <tr>
          <td>박소유</td>
          <td>여성</td>
        </tr>
        <tr>
          <td>이동근</td>
          <td>남성</td>
        </tr>
        <tr>
          <td>임태형</td>
          <td>남성</td>
        </tr>
      </tbody>
      <tbody>
        <tr>
          <th scope="rowgroup" rowspan="5">3조</th>
          <td>박현우</td>
          <td>남성</td>
        </tr>
        <tr>
          <td>방효진</td>
          <td>여성</td>
        </tr>
        <tr>
          <td>엄인호</td>
          <td>남성</td>
        </tr>
        <tr>
          <td>이규화</td>
          <td>남성</td>
        </tr>
        <tr>
          <td>홍정빈</td>
          <td>남성</td>
        </tr>
      </tbody>
      <tbody>
        <tr>
          <th scope="rowgroup" rowspan="5">4조</th>
          <td>송우진</td>
          <td>남성</td>
        </tr>
        <tr>
          <td>이선우</td>
          <td>남성</td>
        </tr>
        <tr>
          <td>장종호</td>
          <td>남성</td>
        </tr>
        <tr>
          <td>최영은</td>
          <td>여성</td>
        </tr>
        <tr>
          <td>추유나</td>
          <td>여성</td>
        </tr>
      </tbody>
      <tfoot>
        <tr>
          <td>총 인원</td>
          <td colspan="2">24명</td>
        </tr>
      </tfoot>
    </table>

    <hr />
    <!-- table 요소를 figure 요소에 선언할 경우 -->
    <figure>
      <table>
        <caption>
          멋사 프론트엔드 부트캠프 17기
        </caption>
        <col class="team" />

        <colgroup>
          <col class="name" />
          <col class="gender" />
        </colgroup>
        <thead>
          <tr>
            <th id="team">회고조</th>
            <th id="name">이름</th>
            <th id="gender">성별</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <th rowspan="3" id="zero" headers="team">0조</th>
            <td headers="name zero">강서진</td>
            <td headers="gender zero">여성</td>
          </tr>
          <tr>
            <td>슬비쌤</td>
            <td>여성</td>
          </tr>
          <tr>
            <td>민규선</td>
            <td>여성</td>
          </tr>
        </tbody>
        <tfoot>
          <tr>
            <td>총 인원</td>
            <td colspan="2">24명</td>
          </tr>
        </tfoot>
      </table>
      <figcaption>...</figcaption>
    </figure>
  </body>
</html>
